# nginx configuration for ВашСад Bot
# Replace YOUR_DOMAIN with your actual domain before use.
# SSL certificates are managed by Certbot (Let's Encrypt).
#
# Initial setup (before SSL):
#   sudo certbot --nginx -d YOUR_DOMAIN
# After Certbot runs it will modify this file to add SSL directives automatically.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # --- SSL (managed by Certbot) ---
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Telegram Webhook ---
    # Bot webhook server runs on port 8443 (services/webhook_server.py)
    location /telegram/ {
        proxy_pass         http://localhost:8443/;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # --- Miniapp (Next.js) ---
    # Next.js dev/production server runs on port 3000
    location / {
        proxy_pass         http://localhost:3000/;
        proxy_http_version 1.1;

        # WebSocket support for Next.js HMR
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
