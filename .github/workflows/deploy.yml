# Required GitHub Secrets:
# DOCKER_USERNAME  — Docker Hub username
# DOCKER_PASSWORD  — Docker Hub password or access token
# VPS_HOST         — IP address or hostname of the VPS
# VPS_USER         — SSH user on the VPS (e.g. root or deploy)
# VPS_KEY          — Private SSH key for VPS access (PEM format)

name: Deploy VashSad Bot

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Не блокирует deploy (см. deploy job ниже, needs: test всё равно
        # проходит) — 6 тестов падают преюдиционно (не связано с main на
        # момент push), см. recon-python-lint-ci / PR #15/#16. Раньше эта
        # команда молча ничего не запускала: requirements.txt не содержал
        # pytest, "python -m pytest" падал с "No module named pytest",
        # `|| echo "No tests found"` это скрывал — тест ни разу реально
        # не выполнился на push в main. Теперь реально выполняется, просто
        # non-blocking.
        run: python -m pytest tests/ --tb=short -q || echo "⚠️ Тесты упали (см. лог выше) — не блокирует деплой, известные преюдиционные сбои см. PR 15 и 16"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vashsad-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /opt/vashsad
            docker compose pull
            docker compose up -d --remove-orphans
