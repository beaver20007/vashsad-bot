name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # Блокирующий с 05.10.2026 (chore/ci-pytest-blocking): на origin/main —
  # 0 failed (проверено живым прогоном перед правкой), "6 преюдиционных
  # сбоев" от 21.08.2026 (PR #15/#16) — устаревший факт, тесты, к которым
  # он относился, давно починены. Раньше `|| echo` на шаге pytest красил
  # шаг зелёным при любом провале — PR не защищал тестами вообще.
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ --tb=short -q

  # Informational, как и test выше: конфиг (pyproject.toml) только что
  # заведён треком chore/t-ruff-setup (2026-08-26), накопленный долг
  # (~350 находок на момент заведения, без автофикса) не блокирует PR.
  # Тот же приём non-blocking — шаг сам возвращает 0 через `|| echo`.
  lint:
    name: ruff (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check . || echo "⚠️ ruff нашёл замечания (см. лог выше) — не блокирует PR, см. docs/ORCHESTRATOR.md для объёма и плана"
