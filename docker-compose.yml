version: "3.9"

services:
  bot:
    build: .
    restart: always
    env_file: .env
    volumes:
      - ./logs:/app/logs
    networks:
      - vashsad-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  webhook:
    build: .
    command: python -m services.webhook_server
    restart: always
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    networks:
      - vashsad-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  vashsad-net:
    driver: bridge

volumes:
  logs:
    driver: local
